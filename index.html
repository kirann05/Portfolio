  <!-- Skydiving Carousel JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Initialize skydiving carousel with slight delay to ensure DOM is fully ready
      setTimeout(initSkydivingCarousel, 1000);

      // Initialize workstation cards toggling after DOM is ready
      initWorkstationGrid();

      // Bind location link interaction
      bindLocationLink();
    });

    function initSkydivingCarousel() {
      const slides = document.querySelectorAll('.slide');

      if (!slides.length) {
        console.log('No slides found');
        return;
      }

      console.log('Found', slides.length, 'skydiving slides');

      let currentSlide = 0;
      const totalSlides = slides.length;
      let slideInterval;

      // Function to show specific slide
      function showSlide(index) {
        // Hide all slides
        slides.forEach((slide, i) => {
          slide.classList.remove('active');
          slide.style.opacity = '0';
          slide.style.zIndex = '1';
        });

        // Show current slide
        slides[index].classList.add('active');
        slides[index].style.opacity = '1';
        slides[index].style.zIndex = '2';

        console.log('Showing slide', index);
      }

      // Start slideshow
      function startSlideshow() {
        slideInterval = setInterval(() => {
          currentSlide = (currentSlide + 1) % totalSlides;
          showSlide(currentSlide);
        }, 1500); // 1.5 seconds per image for faster animation
      }

      // Pause on hover
      const container = document.querySelector('.skydiving-container');
      if (container) {
        container.addEventListener('mouseenter', function () {
          clearInterval(slideInterval);
          console.log('Slideshow paused');
        });

        container.addEventListener('mouseleave', function () {
          startSlideshow();
          console.log('Slideshow resumed');
        });
      }

      // Initialize - show first slide
      showSlide(0);

      // Start the slideshow
      startSlideshow();
      console.log('Skydiving slideshow started');
    }

    function bindLocationLink() {
      const locationButton = document.querySelector('.location-link');
      if (!locationButton) return;

      const locationUrl = locationButton.getAttribute('data-location-url');
      if (!locationUrl) return;

      const navigateToLocation = () => {
        if (document.startViewTransition) {
          document.startViewTransition(() => {
            window.location.assign(locationUrl);
          });
        } else {
          window.location.assign(locationUrl);
        }
      };

      locationButton.addEventListener('click', navigateToLocation);
      locationButton.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          navigateToLocation();
        }
      });
    }

    function initWorkstationGrid() {
      const cards = document.querySelectorAll('.workstation-card');
      const quote = document.querySelector('.workstation-quote');

      cards.forEach(card => {
        const toggle = card.querySelector('.workstation-card-toggle');
        const content = card.querySelector('.workstation-card-content');

        if (!toggle || !content) return;

        toggle.addEventListener('click', () => {
          const isExpanded = toggle.getAttribute('aria-expanded') === 'true';

          cards.forEach(otherCard => {
            const otherToggle = otherCard.querySelector('.workstation-card-toggle');
            const otherContent = otherCard.querySelector('.workstation-card-content');
            if (otherToggle && otherContent && otherCard !== card) {
              otherCard.classList.remove('is-active');
              otherToggle.setAttribute('aria-expanded', 'false');
              otherContent.setAttribute('aria-hidden', 'true');
            }
          });

          if (!isExpanded) {
            card.classList.add('is-active');
            toggle.setAttribute('aria-expanded', 'true');
            content.setAttribute('aria-hidden', 'false');
          } else {
            card.classList.remove('is-active');
            toggle.setAttribute('aria-expanded', 'false');
            content.setAttribute('aria-hidden', 'true');
          }
        });

        // Improve hover accessibility by opening on focus
        toggle.addEventListener('focus', () => {
          card.classList.add('is-focused');
        });
        toggle.addEventListener('blur', () => {
          card.classList.remove('is-focused');
        });
      });

      // Optional animated quote: pause when no cards active
      if (quote) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              quote.classList.add('quote-active');
            } else {
              quote.classList.remove('quote-active');
            }
          });
        }, { threshold: 0.3 });

        observer.observe(quote);
      }
    }
  </script>

    .project-art-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: clamp(24px, 2vw, 32px);
      padding: clamp(28px, 2.5vw, 36px);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 30px 60px -32px rgba(15, 23, 42, 0.35);
      transition: transform 0.7s cubic-bezier(0.19, 1, 0.22, 1),
        box-shadow 0.5s ease, border-color 0.5s ease;
      overflow: hidden;
      opacity: 0;
      transform: translateY(40px) scale(0.98);
    }

    .project-art-card::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.4), rgba(16, 185, 129, 0.3));
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 0;
    }

    .project-art-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 26px;
      background: inherit;
      z-index: 1;
    }

    .project-art-card>* {
      position: relative;
      z-index: 2;
    }

    .project-art-card.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .project-art-card:hover,
    .project-art-card:focus-within,
    .project-art-card.is-expanded {
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 40px 80px -35px rgba(15, 23, 42, 0.45);
    }

    .project-art-card:hover::before,
    .project-art-card:focus-within::before,
    .project-art-card.is-expanded::before {
      opacity: 1;
    }

    .project-art-card--impact {
      --ring-color: rgba(239, 68, 68, 0.35);
      --ring-secondary: rgba(251, 191, 36, 0.25);
    }

    .project-art-card--research {
      --ring-color: rgba(59, 130, 246, 0.35);
      --ring-secondary: rgba(20, 184, 166, 0.3);
    }

    .project-art-card--side {
      --ring-color: rgba(168, 85, 247, 0.35);
      --ring-secondary: rgba(244, 114, 182, 0.28);
    }

    .project-art-card--impact::before {
      background: linear-gradient(135deg, var(--ring-color), var(--ring-secondary));
    }

    .project-art-card--research::before {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.32), rgba(20, 184, 166, 0.25));
    }

    .project-art-card--side::before {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.28), rgba(248, 113, 113, 0.24));
    }

    .dark .project-art-card {
      background: rgba(15, 23, 42, 0.78);
      border-color: rgba(148, 163, 184, 0.25);
      box-shadow: 0 35px 80px -30px rgba(8, 47, 73, 0.75);
    }

    .project-art-media {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      height: clamp(260px, 38vw, 430px);
      background: #0f172a;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.2);
    }

    .project-art-media::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(255, 255, 255, 0.12), transparent 55%);
      mix-blend-mode: screen;
      pointer-events: none;
    }
